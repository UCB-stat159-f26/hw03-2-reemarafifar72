[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisage"
version = "0.1.0"
description = "Retrieve tennis players' career matches from tennisabstract.com and plot opponent age differences."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
test = ["pytest<9"]

[tool.setuptools.packages.find]
where = ["src"]
